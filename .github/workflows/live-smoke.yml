name: live-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omarchy-agent-smoke:
    runs-on: [self-hosted, linux, omarchy-yolo-live]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run real-agent / Omarchy environment smoke
        run: bash scripts/live-smoke.sh
