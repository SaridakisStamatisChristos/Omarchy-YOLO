name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip check
      - name: Audit resolved dependency artifact hashes
        run: |
          rm -rf /tmp/omarchy-yolo-hash-wheels
          mkdir -p /tmp/omarchy-yolo-hash-wheels
          python -m pip download --no-deps -r requirements-dev.lock -d /tmp/omarchy-yolo-hash-wheels >/dev/null
          for artifact in /tmp/omarchy-yolo-hash-wheels/*; do
            echo "HASHFILE $(basename "$artifact")"
            python -m pip hash "$artifact"
          done
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/omarchy_yolo
      - name: Verify source, shell artifacts, tests, and coverage
        run: ./scripts/check.sh
      - name: Build wheel without dependency resolution
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Verify built wheel in clean environment
        run: |
          python -m venv /tmp/omarchy-yolo-wheel
          /tmp/omarchy-yolo-wheel/bin/python -m pip install --no-deps dist/omarchy_yolo-*.whl
          /tmp/omarchy-yolo-wheel/bin/python -c 'import omarchy_yolo; print(omarchy_yolo.__version__)'
          /tmp/omarchy-yolo-wheel/bin/yolo --version
          /tmp/omarchy-yolo-wheel/bin/python -m omarchy_yolo --version
