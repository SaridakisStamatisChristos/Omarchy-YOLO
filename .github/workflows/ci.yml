name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  repair-v14-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v1.4-formal-reliability
      - name: Apply exact v1.4 fixture repairs and restore release CI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_integration_semantics_v12.py')
          text = p.read_text()
          old = 'from omarchy_yolo.model import GateResult, PlannedTask, ReviewResult\n'
          new = 'from omarchy_yolo.model import GateResult, PlannedTask, ReviewResult, TaskState\n'
          if text.count(old) != 1:
              raise SystemExit('integration semantics import anchor mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/test_resilience_v13.py')
          text = p.read_text()
          old = '''            task_state = active_states[index % len(active_states)]
            db.update_job(job.id, state=job_state, stop_requested=stop_requested)
            db.update_task(inflight.id, state=task_state, attempts=1)
            db.update_task(completed.id, state=TaskState.RUNNING)
        db.update_task(completed.id, state=TaskState.REVIEWING)
        db.update_task(completed.id, state=TaskState.INTEGRATING)
        db.update_task(completed.id, state=TaskState.COMPLETED)
            db.start_attempt(
                job_id=job.id,
                task_id=inflight.id,
                number=1,
                agent="fault-injected",
                worktree="/tmp/worktree",
                branch="yolo/task",
                log_path="/tmp/attempt.log",
            )
            cases.append((job.id, not stop_requested and job_state != JobState.STOPPING))
            if not stop_requested and job_state != JobState.STOPPING:
                expected_requeued.add(job.id)
'''
          new = '''            task_state = active_states[index % len(active_states)]
            db.update_job(job.id, state=job_state, stop_requested=stop_requested)
            db.update_task(inflight.id, state=TaskState.RUNNING, attempts=1)
            if task_state in {TaskState.REVIEWING, TaskState.INTEGRATING}:
                db.update_task(inflight.id, state=TaskState.REVIEWING)
            if task_state == TaskState.INTEGRATING:
                db.update_task(inflight.id, state=TaskState.INTEGRATING)
            db.update_task(completed.id, state=TaskState.RUNNING)
            db.update_task(completed.id, state=TaskState.REVIEWING)
            db.update_task(completed.id, state=TaskState.INTEGRATING)
            db.update_task(completed.id, state=TaskState.COMPLETED)
            db.start_attempt(
                job_id=job.id,
                task_id=inflight.id,
                number=1,
                agent="fault-injected",
                worktree="/tmp/worktree",
                branch="yolo/task",
                log_path="/tmp/attempt.log",
            )
            cases.append((job.id, not stop_requested and job_state != JobState.STOPPING))
            if not stop_requested and job_state != JobState.STOPPING:
                expected_requeued.add(job.id)
'''
          if text.count(old) != 1:
              raise SystemExit('resilience recovery fixture anchor mismatch')
          text = text.replace(old, new, 1)
          old_version = 'assert __version__ == project["project"]["version"] == manifest["version"] == "1.3.0"'
          new_version = 'assert __version__ == project["project"]["version"] == manifest["version"] == "1.4.0"'
          if text.count(old_version) != 1:
              raise SystemExit('release-version assertion anchor mismatch')
          p.write_text(text.replace(old_version, new_version, 1))

          helper = Path('.github/workflows/v14-fixture-repair.yml')
          if helper.exists():
              helper.unlink()

          clean_ci = '''name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip check
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/omarchy_yolo
      - name: Verify source, shell artifacts, tests, and coverage
        run: ./scripts/check.sh
      - name: Build wheel without dependency resolution
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Verify built wheel in clean environment
        run: |
          python -m venv /tmp/omarchy-yolo-wheel
          /tmp/omarchy-yolo-wheel/bin/python -m pip install --no-deps dist/omarchy_yolo-*.whl
          /tmp/omarchy-yolo-wheel/bin/python -c 'import omarchy_yolo; assert omarchy_yolo.__version__ == "1.4.0"'
          /tmp/omarchy-yolo-wheel/bin/yolo --version
          /tmp/omarchy-yolo-wheel/bin/python -m omarchy_yolo --version
          /tmp/omarchy-yolo-wheel/bin/yolo-dossier --help >/dev/null
'''
          Path('.github/workflows/ci.yml').write_text(clean_ci)
          PY
          python -m compileall -q tests src
          git diff --check
          git config user.name 'Omarchy YOLO CI'
          git config user.email 'omarchy-yolo@localhost'
          git add tests/test_integration_semantics_v12.py tests/test_resilience_v13.py .github/workflows/ci.yml .github/workflows/v14-fixture-repair.yml
          git diff --cached --check
          git commit -m 'fix: repair v1.4 CI fixtures and restore release workflow'
          git push origin HEAD:feature/v1.4-formal-reliability
