name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip check
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/omarchy_yolo
      - name: Verify source, shell artifacts, tests, and coverage
        run: ./scripts/check.sh
      - name: Build wheel without dependency resolution
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
