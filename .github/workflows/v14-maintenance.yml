name: v14-maintenance

on:
  push:
    branches: [feature/v1.4-formal-reliability]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v1.4-formal-reliability
      - name: Apply exact v1.4 integration patch and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/omarchy_yolo/agents/base.py",
              "self.runner = runner or ProcessRunner()",
              "self.runner = runner or ProcessRunner(resource_policy=global_config.resources)",
          )

          replace_once(
              "src/omarchy_yolo/db_records.py",
              "from .model import JobRecord, JobState, PlannedTask, TaskRecord, TaskState\n",
              "from .model import AttemptState, JobRecord, JobState, PlannedTask, TaskRecord, TaskState\n"
              "from .state_machine import (\n"
              "    validate_attempt_transition,\n"
              "    validate_job_transition,\n"
              "    validate_task_transition,\n"
              ")\n",
          )
          replace_once(
              "src/omarchy_yolo/db_records.py",
              "        values: dict[str, Any] = dict(fields)\n        if isinstance(values.get(\"state\"), JobState):\n",
              "        values: dict[str, Any] = dict(fields)\n"
              "        if \"state\" in values:\n"
              "            current = self.get_job(job_id).state\n"
              "            validate_job_transition(current, JobState(values[\"state\"]))\n"
              "        if isinstance(values.get(\"state\"), JobState):\n",
          )
          replace_once(
              "src/omarchy_yolo/db_records.py",
              "        values: dict[str, Any] = dict(fields)\n        if isinstance(values.get(\"state\"), TaskState):\n",
              "        values: dict[str, Any] = dict(fields)\n"
              "        if \"state\" in values:\n"
              "            current = self.get_task(task_id).state\n"
              "            validate_task_transition(current, TaskState(values[\"state\"]))\n"
              "        if isinstance(values.get(\"state\"), TaskState):\n",
          )
          replace_once(
              "src/omarchy_yolo/db_records.py",
              "    ) -> None:\n        self._execute(\n            \"\"\"\n            UPDATE attempts\n",
              "    ) -> None:\n"
              "        row = self._fetchone(\"SELECT state FROM attempts WHERE id = ?\", (attempt_id,))\n"
              "        if row is None:\n"
              "            raise KeyError(attempt_id)\n"
              "        validate_attempt_transition(AttemptState(str(row[\"state\"])), AttemptState(state))\n"
              "        self._execute(\n"
              "            \"\"\"\n"
              "            UPDATE attempts\n",
          )

          replace_once(
              "src/omarchy_yolo/orchestrator.py",
              "from .planner import Planner\n",
              "from .planner import Planner\nfrom .provenance import DOSSIER_SCHEMA_VERSION, build_dossier\n",
          )
          replace_once(
              "src/omarchy_yolo/orchestrator.py",
              "self.gates = gate_runner or GateRunner(sandbox=Sandbox(config.sandbox))",
              "self.gates = gate_runner or GateRunner(\n"
              "            sandbox=Sandbox(config.sandbox), resource_policy=config.resources\n"
              "        )",
          )
          old_complete = '''        accepted = self.db.get_job(job.id)
        if accepted.auto_apply:
            try:
                async with self.coordinator.repo_lock(repo.root):
                    await atomic_to_thread(
                        repo.fast_forward_source,
                        accepted.integration_branch,
                        accepted.base_branch,
                        accepted.base_commit,
                    )
                self.db.event(accepted.id, "job.applied", {"branch": accepted.base_branch})
            except GitError as exc:
                self.db.event(accepted.id, "job.apply_skipped", {"reason": str(exc)})

        self.db.update_job(
'''
          new_complete = '''        accepted = self.db.get_job(job.id)
        source_apply_outcome = "not-requested"
        if accepted.auto_apply:
            try:
                async with self.coordinator.repo_lock(repo.root):
                    await atomic_to_thread(
                        repo.fast_forward_source,
                        accepted.integration_branch,
                        accepted.base_branch,
                        accepted.base_commit,
                    )
                source_apply_outcome = "applied"
                self.db.event(accepted.id, "job.applied", {"branch": accepted.base_branch})
            except GitError as exc:
                source_apply_outcome = f"skipped: {str(exc)[-1000:]}"
                self.db.event(accepted.id, "job.apply_skipped", {"reason": str(exc)})

        final_commit = await asyncio.to_thread(repo.head, Path(accepted.integration_path))
        dossier_content, dossier_sha256 = await asyncio.to_thread(
            build_dossier,
            db=self.db,
            config=self.config,
            registry=self.registry,
            job_id=accepted.id,
            final_commit=final_commit,
            final_summary=final_summary,
            source_apply_outcome=source_apply_outcome,
        )
        self.db.store_dossier(
            accepted.id,
            schema_version=DOSSIER_SCHEMA_VERSION,
            sha256=dossier_sha256,
            content=dossier_content,
        )
        self.db.event(
            accepted.id,
            "job.dossier_created",
            {"sha256": dossier_sha256, "schema_version": DOSSIER_SCHEMA_VERSION},
        )

        self.db.update_job(
'''
          replace_once("src/omarchy_yolo/orchestrator.py", old_complete, new_complete)

          replace_once(
              "src/omarchy_yolo/daemon.py",
              '''        if method == "events":
            job_id = str(params["job_id"])
''',
              '''        if method == "dossier":
            job_id = str(params["job_id"])
            self.db.get_job(job_id)
            dossier = self.db.get_dossier(job_id)
            if dossier is None:
                raise YoloError("execution dossier is not available until final acceptance")
            return dossier
        if method == "events":
            job_id = str(params["job_id"])
''',
          )
          replace_once(
              "src/omarchy_yolo/daemon.py",
              '''        if method == "runtime":
            return self.coordinator.snapshot()
''',
              '''        if method == "runtime":
            return {
                **self.coordinator.snapshot(),
                "resource_policy": self.config.resources.contract(),
                "schema_version": self.db.schema_version(),
            }
''',
          )

          replace_once(
              "src/omarchy_yolo/cli.py",
              "from .omarchy import toggle_ui\n",
              "from .omarchy import toggle_ui\nfrom .provenance import verify_dossier\n",
          )
          cmd_anchor = '''async def cmd_watch(args: argparse.Namespace) -> int:
    return await _watch(args.job_id)
'''
          cmd_replacement = '''async def cmd_watch(args: argparse.Namespace) -> int:
    return await _watch(args.job_id)


async def cmd_dossier(args: argparse.Namespace) -> int:
    job_id = validate_job_id(args.job_id)
    record = await _rpc("dossier", {"job_id": job_id})
    content = str(record["content"])
    digest = str(record["sha256"])
    if not verify_dossier(content, digest):
        print("Stored dossier digest verification failed.", file=sys.stderr)
        return 1
    if args.verify_only:
        print(digest)
        return 0
    if args.output:
        output = Path(args.output).expanduser()
        ensure_private_dir(output.parent)
        with open_private_binary(output) as fh:
            fh.write((content + "\n").encode("utf-8"))
        print(f"{digest}  {output}")
        return 0
    print(content)
    return 0
'''
          replace_once("src/omarchy_yolo/cli.py", cmd_anchor, cmd_replacement)
          replace_once(
              "src/omarchy_yolo/cli.py",
              '''    if cfg.sandbox.backend == "bwrap":
        checks.append(("bubblewrap", shutil.which("bwrap") is not None, shutil.which("bwrap") or "missing"))
''',
              '''    if cfg.sandbox.backend == "bwrap":
        checks.append(("bubblewrap", shutil.which("bwrap") is not None, shutil.which("bwrap") or "missing"))
    if cfg.resources.enabled:
        checks.append(("systemd-run", shutil.which("systemd-run") is not None, shutil.which("systemd-run") or "missing"))
''',
          )
          replace_once(
              "src/omarchy_yolo/cli.py",
              '''    watch = sub.add_parser("watch", help="follow a job until it finishes")
    watch.add_argument("job_id")
    watch.set_defaults(handler=cmd_watch)

    stop = sub.add_parser("stop", help="stop a running job and its workers")
''',
              '''    watch = sub.add_parser("watch", help="follow a job until it finishes")
    watch.add_argument("job_id")
    watch.set_defaults(handler=cmd_watch)

    dossier = sub.add_parser("dossier", help="verify/export a completed job provenance dossier")
    dossier.add_argument("job_id")
    dossier.add_argument("--output")
    dossier.add_argument("--verify-only", action="store_true")
    dossier.set_defaults(handler=cmd_dossier)

    stop = sub.add_parser("stop", help="stop a running job and its workers")
''',
          )

          Path('.github/workflows/v14-maintenance.yml').unlink()
          PY
          git config user.name 'Omarchy YOLO CI'
          git config user.email 'omarchy-yolo@localhost'
          git add src/omarchy_yolo .github/workflows/v14-maintenance.yml
          git diff --cached --check
          git commit -m 'feat: wire v1.4 state, resources, and provenance contracts'
          git push origin HEAD:feature/v1.4-formal-reliability
