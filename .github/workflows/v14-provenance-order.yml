name: v14-provenance-order

on:
  push:
    branches: [feature/v1.4-formal-reliability]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v1.4-formal-reliability
      - name: Reorder accepted provenance and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/omarchy_yolo/orchestrator.py')
          text = p.read_text()
          old = '''        accepted = self.db.get_job(job.id)
        source_apply_outcome = "not-requested"
        if accepted.auto_apply:
            try:
                async with self.coordinator.repo_lock(repo.root):
                    await atomic_to_thread(
                        repo.fast_forward_source,
                        accepted.integration_branch,
                        accepted.base_branch,
                        accepted.base_commit,
                    )
                source_apply_outcome = "applied"
                self.db.event(accepted.id, "job.applied", {"branch": accepted.base_branch})
            except GitError as exc:
                source_apply_outcome = f"skipped: {str(exc)[-1_000:]}"
                self.db.event(accepted.id, "job.apply_skipped", {"reason": str(exc)})

        final_commit = await asyncio.to_thread(repo.head, Path(accepted.integration_path))
        dossier_content, dossier_sha256 = await asyncio.to_thread(
            build_dossier,
            db=self.db,
            config=self.config,
            registry=self.registry,
            job_id=accepted.id,
            final_commit=final_commit,
            final_summary=final_summary,
            source_apply_outcome=source_apply_outcome,
        )
        self.db.store_dossier(
            accepted.id,
            schema_version=DOSSIER_SCHEMA_VERSION,
            sha256=dossier_sha256,
            content=dossier_content,
        )
        self.db.event(
            accepted.id,
            "job.dossier_created",
            {"sha256": dossier_sha256, "schema_version": DOSSIER_SCHEMA_VERSION},
        )

        self.db.update_job(
'''
          new = '''        accepted = self.db.get_job(job.id)
        final_commit = await asyncio.to_thread(repo.head, Path(accepted.integration_path))
        dossier_content, dossier_sha256 = await asyncio.to_thread(
            build_dossier,
            db=self.db,
            config=self.config,
            registry=self.registry,
            job_id=accepted.id,
            final_commit=final_commit,
            final_summary=final_summary,
            source_apply_intent="requested" if accepted.auto_apply else "not-requested",
        )
        self.db.store_dossier(
            accepted.id,
            schema_version=DOSSIER_SCHEMA_VERSION,
            sha256=dossier_sha256,
            content=dossier_content,
        )
        self.db.event(
            accepted.id,
            "job.dossier_created",
            {"sha256": dossier_sha256, "schema_version": DOSSIER_SCHEMA_VERSION},
        )

        source_apply_outcome = "not-requested"
        if accepted.auto_apply:
            try:
                async with self.coordinator.repo_lock(repo.root):
                    await atomic_to_thread(
                        repo.fast_forward_source,
                        accepted.integration_branch,
                        accepted.base_branch,
                        accepted.base_commit,
                    )
                source_apply_outcome = "applied"
                self.db.event(accepted.id, "job.applied", {"branch": accepted.base_branch})
            except GitError as exc:
                source_apply_outcome = f"skipped: {str(exc)[-1_000:]}"
                self.db.event(accepted.id, "job.apply_skipped", {"reason": str(exc)})

        self.db.update_job(
'''
          if text.count(old) != 1:
              raise SystemExit('orchestrator accepted block anchor mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/test_migrations_provenance_v14.py')
          text = p.read_text()
          if text.count('source_apply_outcome="not-requested"') != 2:
              raise SystemExit('expected two provenance test call sites')
          p.write_text(text.replace('source_apply_outcome="not-requested"', 'source_apply_intent="not-requested"'))

          Path('.github/workflows/v14-provenance-order.yml').unlink()
          PY
          git config user.name 'Omarchy YOLO CI'
          git config user.email 'omarchy-yolo@localhost'
          git add src/omarchy_yolo/orchestrator.py tests/test_migrations_provenance_v14.py .github/workflows/v14-provenance-order.yml
          git diff --cached --check
          git commit -m 'fix: persist provenance before optional source application'
          git push origin HEAD:feature/v1.4-formal-reliability
