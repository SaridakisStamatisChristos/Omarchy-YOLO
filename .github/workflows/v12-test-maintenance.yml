name: v12-test-maintenance

on:
  push:
    branches: [feature/v1.2-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v1.2-hardening
      - name: Replace legacy version literals and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_interfaces_v11.py')
          text = path.read_text()
          needle = 'from omarchy_yolo import cli\n'
          replacement = 'from omarchy_yolo import __version__, cli\n'
          if needle not in text and replacement not in text:
              raise SystemExit('expected import anchor not found')
          text = text.replace(needle, replacement, 1)
          if text.count('== "1.1.0"') != 2:
              raise SystemExit('expected exactly two legacy version assertions')
          text = text.replace('== "1.1.0"', '== __version__')
          path.write_text(text)
          Path('.github/workflows/v12-test-maintenance.yml').unlink()
          PY
          git config user.name 'Omarchy YOLO CI'
          git config user.email 'omarchy-yolo@localhost'
          git add tests/test_interfaces_v11.py .github/workflows/v12-test-maintenance.yml
          git diff --cached --check
          git commit -m 'test: bind daemon version assertions to package version'
          git push origin HEAD:feature/v1.2-hardening
