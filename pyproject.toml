[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-yolo"
version = "1.2.0"
description = "Persistent, multi-agent YOLO orchestration for Omarchy Quattro"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Omarchy YOLO contributors" }]
keywords = ["omarchy", "agents", "codex", "claude", "opencode", "orchestration", "hyprland", "quickshell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
yolo = "omarchy_yolo.cli:main"
omarchy-yolo = "omarchy_yolo.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC"]
ignore = ["E501", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["omarchy_yolo"]

[tool.coverage.run]
branch = true
source = ["omarchy_yolo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
