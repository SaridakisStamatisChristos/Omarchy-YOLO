[engine]
# Per-job parallel task ceiling.
max_parallel = 4
# Daemon-wide ceiling shared by every concurrent job.
max_global_workers = 4
max_attempts = 3
max_final_cycles = 2
max_tasks = 12
agent_timeout_seconds = 3600
gate_timeout_seconds = 1800
planner_agent = "codex"
reviewer_agent = "claude"
integrator_agent = "codex"
worker_agents = ["codex", "claude", "opencode"]
auto_apply = false
cleanup_worktrees = true
execution_profile = "yolo-worktree"
# Final release audit is hierarchical and fail-closed: changed-file shards are
# reviewed first, multi-shard files are semantically synthesized, then file-level
# reports are synthesized across the release.
final_review_chunk_bytes = 60000
final_review_chunk_files = 8
final_review_max_files = 512
# Binary changes are rejected by default because semantic content cannot be
# inspected. Set true only to explicitly permit metadata-only binary review.
final_review_allow_binary = false

[git]
require_clean_repo = true
branch_prefix = "yolo"
commit_name = "Omarchy YOLO"
commit_email = "omarchy-yolo@localhost"
# Every control-plane Git subprocess is bounded and descendant processes are
# terminated with it. Range: 5..900 seconds.
command_timeout_seconds = 120
# Repository-configured clean/smudge/process filters and merge drivers can run
# commands during orchestrator Git operations. Disable for untrusted code; hostile
# repository mode below requires false and defaults it to false when omitted.
allow_repository_commands = true

[gates]
# Empty means auto-detect from the repository. Gate processes use the dedicated
# gate sandbox profile when sandbox.backend = "bwrap": repository cwd remains
# writable, while host filesystem/HOME are read-only. Hostile repository mode
# additionally hides HOME/runtime, strips the gate environment, and forces gates
# offline.
commands = []
final_commands = []

[sandbox]
# native: use each agent's own non-interactive/full-auto mode.
# bwrap: additionally wrap worker/reviewer/gate processes in Bubblewrap.
# none: no external confinement; still runs as your normal user, never sudo.
backend = "native"
network = true
# With bwrap, review/planning always sees HOME read-only. Worker mode can also
# make HOME read-only and selectively re-enable only the credential/session dirs
# required by a coding CLI. In hostile mode HOME is hidden: these directories are
# the only HOME content exposed (writable to workers, read-only to reviewers).
# Gate mode never inherits HOME exceptions.
read_only_home = false
writable_home_paths = []
# Stronger opt-in policy for repositories whose tracked content and configured
# gates are hostile. Requires backend="bwrap". Gate processes receive a fresh
# HOME/runtime view, no network, and only the environment allowlist below;
# orchestrator Git disables repository-configured filter/merge commands.
hostile_repo_mode = false
gate_env_allowlist = []
# Hostile mode also filters worker/planner/reviewer environments. Explicitly list
# only variables an agent CLI must receive (for example one provider token).
agent_env_allowlist = []

[resources]
# Optional cgroups-v2 resource envelope for every agent and gate process tree.
# "none" preserves the v1.3 behavior. "systemd" uses a transient --user scope
# via systemd-run, which is native to Omarchy's systemd user session.
backend = "none"
# 0 disables an individual limit. When both memory values are set, high <= max.
memory_high_mib = 0
memory_max_mib = 0
# Hard process/thread count for each child scope. Useful against fork bombs.
tasks_max = 0
# 100 = one full CPU, 300 = three CPUs worth of quota. 0 disables the quota.
cpu_quota_percent = 0
# cgroups-v2 I/O weight, 1..10000 when enabled. 0 leaves the default unchanged.
io_weight = 0

[agents.codex]
enabled = true
command = ["codex", "exec", "--full-auto", "--sandbox", "workspace-write"]
# Optional least-privilege contract. When omitted, built-ins infer worker,
# integrator, planner and reviewer roles from their verified profile support.
# roles = ["worker", "planner", "reviewer", "integrator"]

[agents.claude]
enabled = true
command = ["claude", "-p", "--dangerously-skip-permissions", "--output-format", "json"]

[agents.opencode]
enabled = true
command = ["opencode", "run", "--format", "json", "--auto"]

[agents.gemini]
enabled = false
command = ["gemini", "-p"]
# Custom/unsupported reviewer CLIs are never assumed read-only. To make a custom
# agent eligible for planner/reviewer roles, explicitly declare a non-mutating command:
# review_command = ["gemini", "-p", "--approval-mode", "plan"]
# roles = ["worker", "planner", "reviewer", "integrator"]

# Example custom adapter:
# [agents.local]
# enabled = true
# command = ["my-agent", "--write"]
# review_command = ["my-agent", "--read-only"]
# roles = ["worker", "planner", "reviewer", "integrator"]
